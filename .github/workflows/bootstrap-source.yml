name: Bootstrap source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: contains(github.event.head_commit.message, '[bootstrap-source]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand v5.1 source
        run: |
          set -euo pipefail
          mkdir -p /tmp/kimik3-source
          unzip -q _bootstrap/kimik3-v5.1-source.zip -d /tmp/kimik3-source
          rsync -a /tmp/kimik3-source/ ./
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish KimiK3-Lite Desktop Studio v5.1 [skip bootstrap]"
          git push origin HEAD:main
