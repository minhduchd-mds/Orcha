name: Publish v6.6.0

on:
  push:
    branches: ['release/v6.6.0']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows source
        shell: pwsh
        run: |
          python -m py_compile app/studio_server_v66.py app/parallel_agent.py
          python app/parallel_agent.py
          node --check studio/parallel-agents.js
      - name: Package Windows portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\KimiK3-Lite-v6-Windows | Out-Null
          $items = @('app','mcp_servers','studio','config','skills','knowledge','docs','scripts','README.md','CHANGELOG.md','LICENSE-NOTE.md','WINDOWS-QUICKSTART-V5.md','Modelfile.v3','Modelfile.v3.max','Modelfile.v3.quality','INSTALL.bat','STUDIO.bat','KimiK3 Studio.vbs','Stop KimiK3 Studio.vbs','Create Desktop Shortcut.vbs','.kimik3ignore')
          foreach ($i in $items) { if (Test-Path $i) { Copy-Item $i dist\KimiK3-Lite-v6-Windows -Recurse -Force } }
          Compress-Archive -Path dist\KimiK3-Lite-v6-Windows -DestinationPath dist\KimiK3-Lite-v6.6.0-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: KimiK3-Lite-v6.6.0-Windows-Portable
          path: dist/KimiK3-Lite-v6.6.0-Windows-Portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify macOS source
        run: |
          python3 -m py_compile app/studio_server_v66.py app/parallel_agent.py
          python3 app/parallel_agent.py
          node --check studio/parallel-agents.js
          bash -n packaging/macos/build-dmg.sh
      - name: Build DMG
        run: |
          ./packaging/macos/build-dmg.sh
          mv dist/KimiK3-Lite-v6-macOS.dmg dist/KimiK3-Lite-v6.6.0-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KimiK3-Lite-v6.6.0-macOS
          path: dist/KimiK3-Lite-v6.6.0-macOS.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release v6.6.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v6.6.0 release-assets/* --target 1a2f21976cd6f3ebdc97a146581f95b1a03d86f2 --generate-notes --title "KimiK3-Lite Studio v6.6.0"
