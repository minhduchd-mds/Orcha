name: Publish v6.8.0

on:
  push:
    branches: ['release/v6.8.0']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows source
        shell: pwsh
        run: |
          python -m py_compile app/studio_server_v68.py app/self_improvement.py app/maintenance.py app/agent_team.py app/parallel_agent.py
          python app/self_improvement.py
          python app/maintenance.py
          node --check studio/final-intelligence.js
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\KimiK3-Lite-v6-Windows | Out-Null
          $items = @('app','mcp_servers','studio','config','skills','knowledge','docs','scripts','README.md','CHANGELOG.md','LICENSE-NOTE.md','WINDOWS-QUICKSTART-V5.md','Modelfile.v3','Modelfile.v3.max','Modelfile.v3.quality','INSTALL.bat','STUDIO.bat','KimiK3 Studio.vbs','Stop KimiK3 Studio.vbs','Create Desktop Shortcut.vbs','.kimik3ignore')
          foreach ($i in $items) { if (Test-Path $i) { Copy-Item $i dist\KimiK3-Lite-v6-Windows -Recurse -Force } }
          Compress-Archive -Path dist\KimiK3-Lite-v6-Windows -DestinationPath dist\KimiK3-Lite-v6.8.0-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/KimiK3-Lite-v6.8.0-Windows-Portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify macOS source
        run: |
          python3 -m py_compile app/studio_server_v68.py app/self_improvement.py app/maintenance.py app/agent_team.py app/parallel_agent.py
          python3 app/self_improvement.py
          python3 app/maintenance.py
          node --check studio/final-intelligence.js
          bash -n packaging/macos/build-dmg.sh
      - name: Build DMG
        run: |
          ./packaging/macos/build-dmg.sh
          mv dist/KimiK3-Lite-v6-macOS.dmg dist/KimiK3-Lite-v6.8.0-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/KimiK3-Lite-v6.8.0-macOS.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release v6.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v6.8.0 release-assets/* --target 9d3a06663991f33917f832b3dc4ed917117d554f --generate-notes --title "KimiK3-Lite Studio v6.8.0"
