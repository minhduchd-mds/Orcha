name: Build Desktop Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows source
        shell: pwsh
        run: |
          python -m py_compile app/kimik3_lite.py app/context_engine.py app/workflow_engine.py app/studio_server.py app/studio_server_v64.py app/studio_server_v65.py app/studio_server_v66.py app/studio_server_v67.py app/uiux_design_agent.py app/parallel_agent.py app/agent_team.py app/model_registry.py app/model_benchmark.py app/skill_runtime.py app/skill_builder.py app/permission_engine.py app/mcp_gateway.py app/mcp_transport.py app/agent_runtime.py app/action_log.py app/benchmark_engine.py mcp_servers/common.py mcp_servers/computer_server.py mcp_servers/autocad_server.py
          python app/kimik3_lite.py --self-test
          python app/model_registry.py
          python app/model_benchmark.py
          python app/uiux_design_agent.py
          python app/parallel_agent.py
          python app/agent_team.py
          python app/skill_runtime.py
          python app/skill_builder.py
          python app/workflow_engine.py
          python app/permission_engine.py
          python app/mcp_transport.py
          python app/mcp_gateway.py
          python app/agent_runtime.py
          python app/action_log.py
          python app/benchmark_engine.py
          node --check studio/app.js
          node --check studio/model-manager.js
          node --check studio/design-agent.js
          node --check studio/parallel-agents.js
          node --check studio/agent-team.js
          python -c "import sys;sys.path.insert(0,'app');import agent_team as t;p=t.plan('Review UI/UX và code',2);assert p['policy']=='parallel-read-serial-write' and p['budget']['workers']<=2 and any(e['to']=='critic' for e in p['edges']);print('PASS: Agent Team DAG + budget')"
          python -c "from pathlib import Path;p=Path('app/studio_server_v67.py').read_text(encoding='utf-8');assert 'agent-team.js' in p and 'agent-team.css' in p;print('PASS: Agent Team workspace injection')"
          python -c "import sys;sys.path.insert(0,'app');import parallel_agent as p;x=p.plan('Review UI/UX và code song song',2);assert x['max_parallel']<=2 and x['strategy']=='parallel-read-serial-write' and x['write_policy']=='serialize_permission_gated';print('PASS: Parallel Agent RAM + write policy')"
          python -c "from pathlib import Path;p=Path('studio/model-manager.js').read_text(encoding='utf-8');assert 'design-agent.js' in p;print('PASS: Design Agent UI contract')"
          python -c "import sys;sys.path.insert(0,'app');import mcp_transport as m;r=m.probe({'command':'@python','args':['{root}/mcp_servers/computer_server.py']},5);assert r['ok'] and r['count']>=6,r;print('PASS: Computer MCP handshake')"
      - name: Package Windows portable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\KimiK3-Lite-v6-Windows | Out-Null
          $items = @('app','mcp_servers','studio','config','skills','knowledge','docs','scripts','README.md','CHANGELOG.md','LICENSE-NOTE.md','WINDOWS-QUICKSTART-V5.md','Modelfile.v3','Modelfile.v3.max','Modelfile.v3.quality','INSTALL.bat','STUDIO.bat','KimiK3 Studio.vbs','Stop KimiK3 Studio.vbs','Create Desktop Shortcut.vbs','.kimik3ignore')
          foreach ($i in $items) { if (Test-Path $i) { Copy-Item $i dist\KimiK3-Lite-v6-Windows -Recurse -Force } }
          Compress-Archive -Path dist\KimiK3-Lite-v6-Windows -DestinationPath dist\KimiK3-Lite-v6-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: KimiK3-Lite-v6-Windows-Portable
          path: dist/KimiK3-Lite-v6-Windows-Portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify macOS source
        run: |
          python3 -m py_compile app/kimik3_lite.py app/context_engine.py app/workflow_engine.py app/studio_server.py app/studio_server_v64.py app/studio_server_v65.py app/studio_server_v66.py app/studio_server_v67.py app/uiux_design_agent.py app/parallel_agent.py app/agent_team.py app/model_registry.py app/model_benchmark.py app/skill_runtime.py app/skill_builder.py app/permission_engine.py app/mcp_gateway.py app/mcp_transport.py app/agent_runtime.py app/action_log.py app/benchmark_engine.py mcp_servers/common.py mcp_servers/computer_server.py mcp_servers/autocad_server.py
          python3 app/kimik3_lite.py --self-test
          python3 app/model_registry.py
          python3 app/model_benchmark.py
          python3 app/uiux_design_agent.py
          python3 app/parallel_agent.py
          python3 app/agent_team.py
          python3 app/skill_runtime.py
          python3 app/skill_builder.py
          python3 app/workflow_engine.py
          python3 app/permission_engine.py
          python3 app/mcp_transport.py
          python3 app/mcp_gateway.py
          python3 app/agent_runtime.py
          python3 app/action_log.py
          python3 app/benchmark_engine.py
          node --check studio/app.js
          node --check studio/model-manager.js
          node --check studio/design-agent.js
          node --check studio/parallel-agents.js
          node --check studio/agent-team.js
          python3 -c "import sys;sys.path.insert(0,'app');import agent_team as t;p=t.plan('Review responsive',2);assert p['budget']['workers']<=2 and p['nodes'][-1]['id']=='synthesis';print('PASS: Agent Team contract')"
          python3 -c "from pathlib import Path;p=Path('app/studio_server_v67.py').read_text(encoding='utf-8');assert 'agent-team.js' in p;print('PASS: v6.7 workspace contract')"
          bash -n "KimiK3 Studio.command" "Stop KimiK3 Studio.command" "INSTALL-macOS.command" packaging/macos/build-dmg.sh
      - name: Build DMG
        if: github.event_name != 'pull_request'
        run: ./packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: KimiK3-Lite-v6-macOS-DMG
          path: dist/KimiK3-Lite-v6-macOS.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Version release assets
        run: |
          mv release-assets/KimiK3-Lite-v6-Windows-Portable.zip "release-assets/KimiK3-Lite-${GITHUB_REF_NAME}-Windows-Portable.zip"
          mv release-assets/KimiK3-Lite-v6-macOS.dmg "release-assets/KimiK3-Lite-${GITHUB_REF_NAME}-macOS.dmg"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --title "KimiK3-Lite Studio ${GITHUB_REF_NAME}"
