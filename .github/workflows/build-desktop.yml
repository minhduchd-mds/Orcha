name: Publish Orcha v7.5.0

on:
  push:
    branches: [release/v7.5.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v7.5 Windows
        shell: pwsh
        run: |
          python -m py_compile app/*.py mcp_servers/*.py
          python app/kimik3_lite.py --self-test
          python app/data_sync.py
          python app/mobile_runtime.py
          python app/reference_catalog.py
          python app/agent_runtime.py
          python app/permission_engine.py
          python app/mcp_gateway.py
          node --check studio/app.js
          node --check studio/orcha-hybrid.js
          node --check studio/ui-foundation.js
          node --check studio/plugin-center.js
          python -c "from pathlib import Path;p=Path('studio/orcha-hybrid.js').read_text(encoding='utf-8');assert 'prompt(' not in p and 'sourceDialog' in p"
          python -c "from pathlib import Path;p=Path('app/studio_server_v70.py').read_text(encoding='utf-8');assert '7.5.0' in p and 'ui_foundation' in p and '/api/reference/plugins' in p"
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Orcha-v7.5.0-Windows | Out-Null
          $items = @('app','mcp_servers','studio','config','skills','knowledge','docs','scripts','README.md','CHANGELOG.md','LICENSE-NOTE.md','WINDOWS-QUICKSTART-V5.md','MACOS-QUICKSTART-V5.md','Modelfile.v3','Modelfile.v3.max','Modelfile.v3.quality','INSTALL.bat','STUDIO.bat','Orcha.vbs','Orcha.command','Stop Orcha.vbs','Stop Orcha.command','Create Desktop Shortcut.vbs','KimiK3 Studio.vbs','KimiK3 Studio.command','.kimik3ignore')
          foreach ($i in $items) { if (Test-Path $i) { Copy-Item $i dist\Orcha-v7.5.0-Windows -Recurse -Force } }
          Compress-Archive -Path dist\Orcha-v7.5.0-Windows -DestinationPath dist\Orcha-v7.5.0-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Orcha-v7.5.0-Windows-Portable
          path: dist/Orcha-v7.5.0-Windows-Portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v7.5 macOS
        run: |
          python3 -m py_compile app/*.py mcp_servers/*.py
          python3 app/kimik3_lite.py --self-test
          python3 app/data_sync.py
          python3 app/mobile_runtime.py
          python3 app/reference_catalog.py
          node --check studio/orcha-hybrid.js
          node --check studio/ui-foundation.js
          node --check studio/plugin-center.js
          bash -n "Orcha.command" "Stop Orcha.command" packaging/macos/build-dmg.sh
      - name: Build macOS DMG
        run: |
          ./packaging/macos/build-dmg.sh
          mv dist/Orcha-v7-macOS.dmg dist/Orcha-v7.5.0-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Orcha-v7.5.0-macOS-DMG
          path: dist/Orcha-v7.5.0-macOS.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release v7.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v7.5.0 >/dev/null 2>&1 && gh release delete v7.5.0 -y --cleanup-tag || true
          gh release create v7.5.0 release-assets/* --target e355250b977b9a478e7cab2cf4d04bde8cd707c2 --generate-notes --title "Orcha v7.5.0"
