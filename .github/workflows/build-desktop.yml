name: Publish Orcha v7.7.0

on:
  push:
    branches: [release/v7.7.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v7.7 Windows
        shell: pwsh
        run: |
          python scripts/verify.py
          python -c "from pathlib import Path;p=Path('app/studio_server_v77.py').read_text(encoding='utf-8');assert '7.7.0' in p and 'ui_contract' in p and 'outline_icons' in p and 'claude_can_override_visual_baseline' in p"
          python -c "from pathlib import Path;p=Path('studio/index.html').read_text(encoding='utf-8');assert 'Anh muốn Orcha làm gì?' in p and 'Orcha cần quyền thực hiện' in p and 'Kimi cần quyền' not in p"
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Orcha-v7.7.0-Windows | Out-Null
          $items = @('app','mcp_servers','studio','config','skills','knowledge','docs','scripts','tests','README.md','CHANGELOG.md','LICENSE','LICENSE-NOTE.md','WINDOWS-QUICKSTART-V5.md','MACOS-QUICKSTART-V5.md','Modelfile.v3','Modelfile.v3.max','Modelfile.v3.quality','INSTALL.bat','STUDIO.bat','Orcha.vbs','Orcha.command','Stop Orcha.vbs','Stop Orcha.command','Create Desktop Shortcut.vbs','KimiK3 Studio.vbs','KimiK3 Studio.command','.kimik3ignore')
          foreach ($i in $items) { if (Test-Path $i) { Copy-Item $i dist\Orcha-v7.7.0-Windows -Recurse -Force } }
          Compress-Archive -Path dist\Orcha-v7.7.0-Windows -DestinationPath dist\Orcha-v7.7.0-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Orcha-v7.7.0-Windows-Portable
          path: dist/Orcha-v7.7.0-Windows-Portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v7.7 macOS
        run: |
          python3 scripts/verify.py
          python3 -c "from pathlib import Path;p=Path('app/studio_server_v77.py').read_text(encoding='utf-8');assert '7.7.0' in p and 'ui_contract' in p and 'outline_icons' in p"
          python3 -c "from pathlib import Path;p=Path('studio/index.html').read_text(encoding='utf-8');assert 'Anh muốn Orcha làm gì?' in p and 'Orcha cần quyền thực hiện' in p and 'Kimi cần quyền' not in p"
          bash -n "Orcha.command" "Stop Orcha.command" packaging/macos/build-dmg.sh
      - name: Build macOS DMG
        run: |
          ./packaging/macos/build-dmg.sh
          mv dist/Orcha-v7-macOS.dmg dist/Orcha-v7.7.0-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Orcha-v7.7.0-macOS-DMG
          path: dist/Orcha-v7.7.0-macOS.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release v7.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v7.7.0 >/dev/null 2>&1 && gh release delete v7.7.0 -y --cleanup-tag || true
          gh release create v7.7.0 release-assets/* --target 3176ba317328445e4998ecfb88a71fafb97b29b4 --generate-notes --title "Orcha v7.7.0"
