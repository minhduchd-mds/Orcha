name: Build Orcha Desktop Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows source
        shell: pwsh
        run: |
          python -m py_compile app/*.py mcp_servers/*.py
          python app/kimik3_lite.py --self-test
          python app/model_registry.py
          python app/hermes_runtime.py
          python app/harness_runtime.py
          python app/project_workspace.py
          python app/project_planner.py
          python app/project_supervisor.py
          python app/data_sync.py
          python app/mobile_runtime.py
          python app/reference_catalog.py
          python app/agent_runtime.py
          python app/parallel_agent.py
          python app/agent_team.py
          python app/permission_engine.py
          python app/mcp_gateway.py
          node --check studio/app.js
          node --check studio/project-workspace.js
          node --check studio/project-planner.js
          node --check studio/project-supervisor.js
          node --check studio/orcha-hybrid.js
          node --check studio/ui-foundation.js
          node --check studio/plugin-center.js
          node --check studio/model-manager.js
          node --check studio/design-agent.js
          node --check studio/parallel-agents.js
          node --check studio/agent-team.js
          python -c "from pathlib import Path;p=Path('studio/orcha-hybrid.js').read_text(encoding='utf-8');assert 'prompt(' not in p and 'sourceDialog' in p and 'PRESETS' in p;print('PASS: Data Hub uses product modal, no native prompt')"
          python -c "from pathlib import Path;p=Path('studio/ui-foundation.js').read_text(encoding='utf-8');assert 'closeInspector' in p and 'aria-label' in p and 'parallelAgentBtn' in p and 'teamToggle' in p;print('PASS: inspector close + icon composer accessibility')"
          python -c "import sys;sys.path.insert(0,'app');import reference_catalog as r;x=r.load();assert len(x['items'])>=30 and not x['policy']['auto_install'];print('PASS: external plugin catalog stays research-only')"
          python -c "from pathlib import Path;p=Path('app/studio_server_v70.py').read_text(encoding='utf-8');assert '7.5.0' in p and 'ui_foundation' in p and '/api/reference/plugins' in p and 'plugin-center.js' in p;print('PASS: Orcha v7.5 UI server contract')"
          python -c "from pathlib import Path;p=Path('Orcha.vbs').read_text(encoding='utf-8');assert '7.5.0' in p and 'ui_foundation' in p;print('PASS: Windows Orcha launcher')"
          python -c "import sys;sys.path.insert(0,'app');import data_sync as d;assert d.status()['policy']['network_read_only'];print('PASS: Data Hub safety regression')"
          python -c "import sys;sys.path.insert(0,'app');import agent_team as t;p=t.plan('Review UI/UX',2);assert p['budget']['workers']<=2 and p['policy']=='parallel-read-serial-write';print('PASS: team regression')"
          python -c "import sys;sys.path.insert(0,'app');import mcp_transport as m;r=m.probe({'command':'@python','args':['{root}/mcp_servers/computer_server.py']},5);assert r['ok'] and r['count']>=6,r;print('PASS: MCP regression')"
      - name: Package Windows portable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Orcha-v7-Windows | Out-Null
          $items = @('app','mcp_servers','studio','config','skills','knowledge','docs','scripts','README.md','CHANGELOG.md','LICENSE-NOTE.md','WINDOWS-QUICKSTART-V5.md','MACOS-QUICKSTART-V5.md','Modelfile.v3','Modelfile.v3.max','Modelfile.v3.quality','INSTALL.bat','STUDIO.bat','Orcha.vbs','Orcha.command','Stop Orcha.vbs','Stop Orcha.command','Create Desktop Shortcut.vbs','KimiK3 Studio.vbs','KimiK3 Studio.command','.kimik3ignore')
          foreach ($i in $items) { if (Test-Path $i) { Copy-Item $i dist\Orcha-v7-Windows -Recurse -Force } }
          Compress-Archive -Path dist\Orcha-v7-Windows -DestinationPath dist\Orcha-v7-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Orcha-v7-Windows-Portable
          path: dist/Orcha-v7-Windows-Portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify macOS source
        run: |
          python3 -m py_compile app/*.py mcp_servers/*.py
          python3 app/kimik3_lite.py --self-test
          python3 app/model_registry.py
          python3 app/hermes_runtime.py
          python3 app/harness_runtime.py
          python3 app/project_workspace.py
          python3 app/project_planner.py
          python3 app/project_supervisor.py
          python3 app/data_sync.py
          python3 app/mobile_runtime.py
          python3 app/reference_catalog.py
          python3 app/agent_runtime.py
          python3 app/parallel_agent.py
          python3 app/agent_team.py
          python3 app/permission_engine.py
          python3 app/mcp_gateway.py
          node --check studio/app.js
          node --check studio/project-workspace.js
          node --check studio/project-planner.js
          node --check studio/project-supervisor.js
          node --check studio/orcha-hybrid.js
          node --check studio/ui-foundation.js
          node --check studio/plugin-center.js
          node --check studio/model-manager.js
          node --check studio/design-agent.js
          python3 -c "from pathlib import Path;p=Path('studio/orcha-hybrid.js').read_text(encoding='utf-8');assert 'prompt(' not in p and 'sourceDialog' in p;print('PASS: modal data source flow')"
          python3 -c "from pathlib import Path;p=Path('app/studio_server_v70.py').read_text(encoding='utf-8');assert '7.5.0' in p and 'reference_lab' in p and 'icon_composer' in p;print('PASS: Orcha server policy')"
          python3 -c "from pathlib import Path;p=Path('Orcha.command').read_text(encoding='utf-8');assert '7.5.0' in p and 'ui_foundation' in p;print('PASS: macOS Orcha launcher')"
          bash -n "Orcha.command" "Stop Orcha.command" "KimiK3 Studio.command" "Stop KimiK3 Studio.command" "INSTALL-macOS.command" packaging/macos/build-dmg.sh
      - name: Build DMG
        if: github.event_name != 'pull_request'
        run: ./packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Orcha-v7-macOS-DMG
          path: dist/Orcha-v7-macOS.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Version release assets
        run: |
          mv release-assets/Orcha-v7-Windows-Portable.zip "release-assets/Orcha-${GITHUB_REF_NAME}-Windows-Portable.zip"
          mv release-assets/Orcha-v7-macOS.dmg "release-assets/Orcha-${GITHUB_REF_NAME}-macOS.dmg"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --title "Orcha ${GITHUB_REF_NAME}"
