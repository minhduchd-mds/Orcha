name: Build Orcha Desktop Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v7.7 Windows
        shell: pwsh
        run: |
          python scripts/check_brand.py
          python scripts/verify.py
          python -c "from pathlib import Path;p=Path('app/studio_server_v77.py').read_text(encoding='utf-8');assert '7.7.0' in p and 'ui_contract' in p and 'outline_icons' in p and 'claude_can_override_visual_baseline' in p"
          python -c "from pathlib import Path;p=Path('studio/index.html').read_text(encoding='utf-8');assert 'Anh muốn Orcha làm gì?' in p and 'Orcha cần quyền thực hiện' in p"
          python -c "from pathlib import Path;p=Path('studio/ui-foundation.js').read_text(encoding='utf-8');assert \"iconRule:'outline-only'\" in p and 'fill=\"none\"' in p and 'stroke=\"currentColor\"' in p"
          python -c "from pathlib import Path;p=Path('studio/orcha-hybrid.js').read_text(encoding='utf-8');assert 'prompt(' not in p and 'sourceDialog' in p"
          python -c "from pathlib import Path;p=Path('studio/api-client.js').read_text(encoding='utf-8');assert 'X-Orcha-Token' in p and '/api/session' in p"
      - name: Package Windows portable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Orcha-v7-Windows | Out-Null
          $items = @('app','mcp_servers','studio','config','skills','knowledge','docs','scripts','tests','README.md','CHANGELOG.md','LICENSE','LICENSE-NOTE.md','WINDOWS-QUICKSTART-V5.md','MACOS-QUICKSTART-V5.md','Modelfile.v3','Modelfile.v3.max','Modelfile.v3.quality','INSTALL.bat','STUDIO.bat','Orcha.vbs','Orcha.command','Stop Orcha.vbs','Stop Orcha.command','Create Desktop Shortcut.vbs','.orchaignore')
          foreach ($i in $items) { if (Test-Path $i) { Copy-Item $i dist\Orcha-v7-Windows -Recurse -Force } }
          Compress-Archive -Path dist\Orcha-v7-Windows -DestinationPath dist\Orcha-v7-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Orcha-v7-Windows-Portable
          path: dist/Orcha-v7-Windows-Portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v7.7 macOS
        run: |
          python3 scripts/check_brand.py
          python3 scripts/verify.py
          python3 -c "from pathlib import Path;p=Path('app/studio_server_v77.py').read_text(encoding='utf-8');assert '7.7.0' in p and 'ui_contract' in p and 'outline_icons' in p"
          python3 -c "from pathlib import Path;p=Path('studio/index.html').read_text(encoding='utf-8');assert 'Anh muốn Orcha làm gì?' in p and 'Orcha cần quyền thực hiện' in p"
          python3 -c "from pathlib import Path;p=Path('studio/ui-foundation.js').read_text(encoding='utf-8');assert \"iconRule:'outline-only'\" in p and 'fill=\"none\"' in p and 'stroke=\"currentColor\"' in p"
          python3 -c "from pathlib import Path;p=Path('studio/orcha-hybrid.js').read_text(encoding='utf-8');assert 'prompt(' not in p and 'sourceDialog' in p"
          python3 -c "from pathlib import Path;p=Path('studio/api-client.js').read_text(encoding='utf-8');assert 'X-Orcha-Token' in p and '/api/session' in p"
          bash -n "Orcha.command" "Stop Orcha.command" "INSTALL-macOS.command" packaging/macos/build-dmg.sh
      - name: Build DMG
        if: github.event_name != 'pull_request'
        run: ./packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Orcha-v7-macOS-DMG
          path: dist/Orcha-v7-macOS.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Version release assets
        run: |
          mv release-assets/Orcha-v7-Windows-Portable.zip "release-assets/Orcha-${GITHUB_REF_NAME}-Windows-Portable.zip"
          mv release-assets/Orcha-v7-macOS.dmg "release-assets/Orcha-${GITHUB_REF_NAME}-macOS.dmg"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --title "Orcha ${GITHUB_REF_NAME}"
