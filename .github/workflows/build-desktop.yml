name: Build Desktop Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows source
        shell: pwsh
        run: |
          python -m py_compile app/kimik3_lite.py app/context_engine.py app/workflow_engine.py app/studio_server.py app/studio_server_v64.py app/model_registry.py app/model_benchmark.py app/skill_runtime.py app/skill_builder.py app/permission_engine.py app/mcp_gateway.py app/mcp_transport.py app/agent_runtime.py app/action_log.py app/benchmark_engine.py mcp_servers/common.py mcp_servers/computer_server.py mcp_servers/autocad_server.py
          python app/kimik3_lite.py --self-test
          python app/model_registry.py
          python app/model_benchmark.py
          python app/skill_runtime.py
          python app/skill_builder.py
          python app/workflow_engine.py
          python app/permission_engine.py
          python app/mcp_transport.py
          python app/mcp_gateway.py
          python app/agent_runtime.py
          python app/action_log.py
          python app/benchmark_engine.py
          node --check studio/app.js
          node --check studio/model-manager.js
          python -c "from pathlib import Path;p=Path('studio/index.html').read_text(encoding='utf-8');assert 'skillLibrary' in p and 'workflowCanvas' in p and 'modelLibrary' in p and 'modelMode' in p;print('PASS: v6.4 Studio DOM contract')"
          python -c "import sys;sys.path.insert(0,'app');import model_registry as m;assert m.get('uiux-vision-lite');assert m.classify_task('review UI/UX screenshot')=='uiux';assert m.route('review code').get('selected');print('PASS: Model Registry + Auto Router')"
          python -c "import sys;sys.path.insert(0,'app');import model_benchmark as b;r=b.compare(['max','balanced','uiux-vision-lite']);assert len(r['models'])==3;print('PASS: Model comparison contract')"
          python -c "import sys;sys.path.insert(0,'app');import skill_builder as s;assert callable(s.list_all) and callable(s.duplicate) and callable(s.delete) and callable(s.versions);print('PASS: Skill CRUD API contract')"
          python -c "import sys;sys.path.insert(0,'app');import workflow_engine as w;assert callable(w.reorder) and callable(w.duplicate_workflow);print('PASS: Workflow builder API contract')"
          python -c "import sys;sys.path.insert(0,'app');import mcp_transport as m;r=m.probe({'command':'@python','args':['{root}/mcp_servers/computer_server.py']},5);assert r['ok'] and r['count']>=6,r;print('PASS: Computer MCP element handshake')"
      - name: Package Windows portable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\KimiK3-Lite-v6-Windows | Out-Null
          $items = @('app','mcp_servers','studio','config','skills','knowledge','docs','scripts','README.md','CHANGELOG.md','LICENSE-NOTE.md','WINDOWS-QUICKSTART-V5.md','Modelfile.v3','Modelfile.v3.max','Modelfile.v3.quality','INSTALL.bat','STUDIO.bat','KimiK3 Studio.vbs','Stop KimiK3 Studio.vbs','Create Desktop Shortcut.vbs','.kimik3ignore')
          foreach ($i in $items) { if (Test-Path $i) { Copy-Item $i dist\KimiK3-Lite-v6-Windows -Recurse -Force } }
          Compress-Archive -Path dist\KimiK3-Lite-v6-Windows -DestinationPath dist\KimiK3-Lite-v6-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: KimiK3-Lite-v6-Windows-Portable
          path: dist/KimiK3-Lite-v6-Windows-Portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify macOS source
        run: |
          python3 -m py_compile app/kimik3_lite.py app/context_engine.py app/workflow_engine.py app/studio_server.py app/studio_server_v64.py app/model_registry.py app/model_benchmark.py app/skill_runtime.py app/skill_builder.py app/permission_engine.py app/mcp_gateway.py app/mcp_transport.py app/agent_runtime.py app/action_log.py app/benchmark_engine.py mcp_servers/common.py mcp_servers/computer_server.py mcp_servers/autocad_server.py
          python3 app/kimik3_lite.py --self-test
          python3 app/model_registry.py
          python3 app/model_benchmark.py
          python3 app/skill_runtime.py
          python3 app/skill_builder.py
          python3 app/workflow_engine.py
          python3 app/permission_engine.py
          python3 app/mcp_transport.py
          python3 app/mcp_gateway.py
          python3 app/agent_runtime.py
          python3 app/action_log.py
          python3 app/benchmark_engine.py
          node --check studio/app.js
          node --check studio/model-manager.js
          python3 -c "from pathlib import Path;p=Path('studio/index.html').read_text(encoding='utf-8');assert 'modelLibrary' in p and 'UI/UX Specialist' in p;print('PASS: v6.4 Model Manager DOM contract')"
          python3 -c "import sys;sys.path.insert(0,'app');import model_registry as m;assert m.get('uiux-vision-lite') and m.route('UI/UX screenshot',True).get('selected');print('PASS: Model Registry + UIUX route')"
          bash -n "KimiK3 Studio.command" "Stop KimiK3 Studio.command" "INSTALL-macOS.command" packaging/macos/build-dmg.sh
      - name: Build DMG
        if: github.event_name != 'pull_request'
        run: ./packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: KimiK3-Lite-v6-macOS-DMG
          path: dist/KimiK3-Lite-v6-macOS.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --title "KimiK3-Lite Studio ${GITHUB_REF_NAME}"
