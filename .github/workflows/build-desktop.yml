name: Publish Orcha v7.4.0

on:
  push:
    branches: [release/v7.4.0]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows source
        shell: pwsh
        run: |
          python -m py_compile app/*.py mcp_servers/*.py
          python app/data_sync.py
          python app/mobile_runtime.py
          node --check studio/orcha-hybrid.js
      - name: Package Windows portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Orcha-v7-Windows | Out-Null
          $items = @('app','mcp_servers','studio','config','skills','knowledge','docs','scripts','README.md','CHANGELOG.md','LICENSE-NOTE.md','WINDOWS-QUICKSTART-V5.md','MACOS-QUICKSTART-V5.md','Modelfile.v3','Modelfile.v3.max','Modelfile.v3.quality','INSTALL.bat','STUDIO.bat','Orcha.vbs','Orcha.command','Stop Orcha.vbs','Stop Orcha.command','Create Desktop Shortcut.vbs','KimiK3 Studio.vbs','KimiK3 Studio.command','.kimik3ignore')
          foreach ($i in $items) { if (Test-Path $i) { Copy-Item $i dist\Orcha-v7-Windows -Recurse -Force } }
          Compress-Archive -Path dist\Orcha-v7-Windows -DestinationPath dist\Orcha-v7.4.0-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Orcha-v7.4.0-Windows-Portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify macOS source
        run: |
          python3 -m py_compile app/*.py mcp_servers/*.py
          python3 app/data_sync.py
          python3 app/mobile_runtime.py
          node --check studio/orcha-hybrid.js
          bash -n Orcha.command "Stop Orcha.command" packaging/macos/build-dmg.sh
      - name: Build DMG
        run: |
          ./packaging/macos/build-dmg.sh
          mv dist/Orcha-v7-macOS.dmg dist/Orcha-v7.4.0-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Orcha-v7.4.0-macOS.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release v7.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v7.4.0 release-assets/* --target 5488f568e40a4015e5ac5a49d69755146deaefb2 --generate-notes --title 'Orcha v7.4.0'
