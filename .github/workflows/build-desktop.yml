name: Publish v6.5.0

on:
  push:
    branches: ['release/v6.5.0']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows source
        shell: pwsh
        run: |
          python -m py_compile app/kimik3_lite.py app/context_engine.py app/workflow_engine.py app/studio_server.py app/studio_server_v64.py app/studio_server_v65.py app/uiux_design_agent.py app/model_registry.py app/model_benchmark.py app/skill_runtime.py app/skill_builder.py app/permission_engine.py app/mcp_gateway.py app/mcp_transport.py app/agent_runtime.py app/action_log.py app/benchmark_engine.py mcp_servers/common.py mcp_servers/computer_server.py mcp_servers/autocad_server.py
          python app/kimik3_lite.py --self-test
          python app/uiux_design_agent.py
          node --check studio/app.js
          node --check studio/model-manager.js
          node --check studio/design-agent.js
          python -c "import sys;sys.path.insert(0,'app');import uiux_design_agent as d;r=d.build_report([{'name':'D','width':1440},{'name':'M','width':430}],[{'issues':[]},{'issues':[]}]);assert r['responsive']['multi_viewport'] and r['figma_handoff']['requires_confirmation_for_write'];print('PASS: v6.5 UIUX Design Agent')"
      - name: Package Windows portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\KimiK3-Lite-v6.5.0-Windows | Out-Null
          $items = @('app','mcp_servers','studio','config','skills','knowledge','docs','scripts','README.md','CHANGELOG.md','LICENSE-NOTE.md','WINDOWS-QUICKSTART-V5.md','Modelfile.v3','Modelfile.v3.max','Modelfile.v3.quality','INSTALL.bat','STUDIO.bat','KimiK3 Studio.vbs','Stop KimiK3 Studio.vbs','Create Desktop Shortcut.vbs','.kimik3ignore')
          foreach ($i in $items) { if (Test-Path $i) { Copy-Item $i dist\KimiK3-Lite-v6.5.0-Windows -Recurse -Force } }
          Compress-Archive -Path dist\KimiK3-Lite-v6.5.0-Windows -DestinationPath dist\KimiK3-Lite-v6.5.0-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: KimiK3-Lite-v6.5.0-Windows-Portable
          path: dist/KimiK3-Lite-v6.5.0-Windows-Portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify macOS source
        run: |
          python3 -m py_compile app/kimik3_lite.py app/context_engine.py app/workflow_engine.py app/studio_server.py app/studio_server_v64.py app/studio_server_v65.py app/uiux_design_agent.py app/model_registry.py app/model_benchmark.py app/skill_runtime.py app/skill_builder.py app/permission_engine.py app/mcp_gateway.py app/mcp_transport.py app/agent_runtime.py app/action_log.py app/benchmark_engine.py mcp_servers/common.py mcp_servers/computer_server.py mcp_servers/autocad_server.py
          python3 app/kimik3_lite.py --self-test
          python3 app/uiux_design_agent.py
          node --check studio/app.js
          node --check studio/model-manager.js
          node --check studio/design-agent.js
          bash -n "KimiK3 Studio.command" "Stop KimiK3 Studio.command" "INSTALL-macOS.command" packaging/macos/build-dmg.sh
      - name: Build DMG
        run: ./packaging/macos/build-dmg.sh
      - name: Rename DMG
        run: mv dist/KimiK3-Lite-v6-macOS.dmg dist/KimiK3-Lite-v6.5.0-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KimiK3-Lite-v6.5.0-macOS-DMG
          path: dist/KimiK3-Lite-v6.5.0-macOS.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release v6.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v6.5.0 >/dev/null 2>&1 && gh release delete v6.5.0 -y --cleanup-tag || true
          gh release create v6.5.0 release-assets/* --target ae7c79b0383a42056a41c98434189d1250935ea9 --generate-notes --title "KimiK3-Lite Studio v6.5.0"
