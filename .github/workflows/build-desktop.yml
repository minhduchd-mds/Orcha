name: Build Desktop Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows source
        shell: pwsh
        run: |
          python -m py_compile app/kimik3_lite.py app/context_engine.py app/workflow_engine.py app/studio_server.py app/studio_server_v64.py app/studio_server_v65.py app/studio_server_v66.py app/studio_server_v67.py app/studio_server_v68.py app/studio_server_v69.py app/studio_server_v70.py app/project_workspace.py app/project_planner.py app/harness_runtime.py app/verification_engine.py app/hermes_runtime.py app/uiux_design_agent.py app/parallel_agent.py app/agent_team.py app/self_improvement.py app/maintenance.py app/model_registry.py app/model_benchmark.py app/skill_runtime.py app/skill_builder.py app/permission_engine.py app/mcp_gateway.py app/mcp_transport.py app/agent_runtime.py app/action_log.py app/benchmark_engine.py mcp_servers/common.py mcp_servers/computer_server.py mcp_servers/autocad_server.py
          python app/kimik3_lite.py --self-test
          python app/model_registry.py
          python app/hermes_runtime.py
          python app/harness_runtime.py
          python app/verification_engine.py
          python app/project_workspace.py
          python app/project_planner.py
          python app/agent_runtime.py
          python app/parallel_agent.py
          python app/agent_team.py
          python app/self_improvement.py
          python app/maintenance.py
          python app/permission_engine.py
          python app/mcp_gateway.py
          node --check studio/app.js
          node --check studio/model-manager.js
          node --check studio/design-agent.js
          node --check studio/parallel-agents.js
          node --check studio/agent-team.js
          node --check studio/final-intelligence.js
          node --check studio/hermes.js
          node --check studio/harness.js
          node --check studio/project-workspace.js
          node --check studio/project-planner.js
          python -c "import sys;sys.path.insert(0,'app');import project_planner as p;x=p.plan('Audit UI/UX và cập nhật thiết kế',4);assert x['policy']['write_requires_approval'] and any(t['approval_required'] for t in x['tasks']);print('PASS: autonomous planner safety')"
          python -c "from pathlib import Path;p=Path('app/studio_server_v70.py').read_text(encoding='utf-8');assert 'project-planner.js' in p and '/api/planner/plan' in p and '7.2.0' in p;print('PASS: v7.2 planner server contract')"
          python -c "from pathlib import Path;p=Path('KimiK3 Studio.vbs').read_text(encoding='utf-8');assert '7.2.0' in p and 'autonomous_project_planner' in p;print('PASS: Windows launcher v7.2')"
          python -c "import sys;sys.path.insert(0,'app');import agent_team as t;p=t.plan('Review UI/UX',2);assert p['budget']['workers']<=2 and p['policy']=='parallel-read-serial-write';print('PASS: team regression')"
          python -c "import sys;sys.path.insert(0,'app');import mcp_transport as m;r=m.probe({'command':'@python','args':['{root}/mcp_servers/computer_server.py']},5);assert r['ok'] and r['count']>=6,r;print('PASS: MCP regression')"
      - name: Package Windows portable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\KimiK3-Lite-v7-Windows | Out-Null
          $items = @('app','mcp_servers','studio','config','skills','knowledge','docs','scripts','README.md','CHANGELOG.md','LICENSE-NOTE.md','WINDOWS-QUICKSTART-V5.md','Modelfile.v3','Modelfile.v3.max','Modelfile.v3.quality','INSTALL.bat','STUDIO.bat','KimiK3 Studio.vbs','Stop KimiK3 Studio.vbs','Create Desktop Shortcut.vbs','.kimik3ignore')
          foreach ($i in $items) { if (Test-Path $i) { Copy-Item $i dist\KimiK3-Lite-v7-Windows -Recurse -Force } }
          Compress-Archive -Path dist\KimiK3-Lite-v7-Windows -DestinationPath dist\KimiK3-Lite-v7-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: KimiK3-Lite-v7-Windows-Portable
          path: dist/KimiK3-Lite-v7-Windows-Portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify macOS source
        run: |
          python3 -m py_compile app/kimik3_lite.py app/context_engine.py app/workflow_engine.py app/studio_server.py app/studio_server_v64.py app/studio_server_v65.py app/studio_server_v66.py app/studio_server_v67.py app/studio_server_v68.py app/studio_server_v69.py app/studio_server_v70.py app/project_workspace.py app/project_planner.py app/harness_runtime.py app/verification_engine.py app/hermes_runtime.py app/uiux_design_agent.py app/parallel_agent.py app/agent_team.py app/self_improvement.py app/maintenance.py app/model_registry.py app/model_benchmark.py app/skill_runtime.py app/skill_builder.py app/permission_engine.py app/mcp_gateway.py app/mcp_transport.py app/agent_runtime.py app/action_log.py app/benchmark_engine.py mcp_servers/common.py mcp_servers/computer_server.py mcp_servers/autocad_server.py
          python3 app/kimik3_lite.py --self-test
          python3 app/model_registry.py
          python3 app/hermes_runtime.py
          python3 app/harness_runtime.py
          python3 app/verification_engine.py
          python3 app/project_workspace.py
          python3 app/project_planner.py
          python3 app/agent_runtime.py
          python3 app/parallel_agent.py
          python3 app/agent_team.py
          python3 app/self_improvement.py
          python3 app/maintenance.py
          node --check studio/app.js
          node --check studio/model-manager.js
          node --check studio/design-agent.js
          node --check studio/parallel-agents.js
          node --check studio/agent-team.js
          node --check studio/final-intelligence.js
          node --check studio/hermes.js
          node --check studio/harness.js
          node --check studio/project-workspace.js
          node --check studio/project-planner.js
          python3 -c "import sys;sys.path.insert(0,'app');import project_planner as p;x=p.plan('Review code và sửa lỗi',4);assert x['estimate']['tasks']>=4 and x['policy']['auto_permission_escalation']==False;print('PASS: planner contract')"
          python3 -c "from pathlib import Path;p=Path('KimiK3 Studio.command').read_text(encoding='utf-8');assert '7.2.0' in p and 'autonomous_project_planner' in p;print('PASS: macOS launcher v7.2')"
          bash -n "KimiK3 Studio.command" "Stop KimiK3 Studio.command" "INSTALL-macOS.command" packaging/macos/build-dmg.sh
      - name: Build DMG
        if: github.event_name != 'pull_request'
        run: ./packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: KimiK3-Lite-v7-macOS-DMG
          path: dist/KimiK3-Lite-v7-macOS.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Version release assets
        run: |
          mv release-assets/KimiK3-Lite-v7-Windows-Portable.zip "release-assets/KimiK3-Lite-${GITHUB_REF_NAME}-Windows-Portable.zip"
          mv release-assets/KimiK3-Lite-v7-macOS.dmg "release-assets/KimiK3-Lite-${GITHUB_REF_NAME}-macOS.dmg"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --title "KimiK3-Lite Studio ${GITHUB_REF_NAME}"
