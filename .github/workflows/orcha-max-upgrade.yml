name: Orcha MAX upgrade

on:
  push:
    branches:
      - feat/upgrade-orcha-max-qwen35-2b
    paths:
      - 'scripts/_upgrade_orcha_max.py'
      - '.github/workflows/orcha-max-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/upgrade-orcha-max-qwen35-2b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply MAX upgrade
        run: python scripts/_upgrade_orcha_max.py
      - name: Remove one-shot migration script
        run: rm -f scripts/_upgrade_orcha_max.py
      - name: Verify upgraded tree
        run: |
          python scripts/check_brand.py
          python scripts/verify.py --fast
      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows'
          git diff --cached --quiet && exit 0
          git commit -m 'feat(model): upgrade Orcha MAX to Qwen3.5 2B'
          git push origin HEAD:feat/upgrade-orcha-max-qwen35-2b
