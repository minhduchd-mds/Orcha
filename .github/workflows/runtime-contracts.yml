name: Runtime contracts

on:
  pull_request:
    paths:
      - 'app/session_handle.py'
      - 'app/tool_stream.py'
      - 'app/team_mailbox.py'
      - 'app/agent_team.py'
      - 'app/storage.py'
      - 'app/benchmark_engine.py'
      - 'app/network_transport.py'
      - 'app/model_registry.py'
      - 'app/model_benchmark.py'
      - 'app/orcha_core.py'
      - '.github/workflows/runtime-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'app/session_handle.py'
      - 'app/tool_stream.py'
      - 'app/team_mailbox.py'
      - 'app/agent_team.py'
      - 'app/storage.py'
      - 'app/benchmark_engine.py'
      - 'app/network_transport.py'
      - 'app/model_registry.py'
      - 'app/model_benchmark.py'
      - 'app/orcha_core.py'
      - '.github/workflows/runtime-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime contracts
        run: python -m py_compile app/session_handle.py app/tool_stream.py app/team_mailbox.py app/agent_team.py app/storage.py app/benchmark_engine.py app/network_transport.py app/model_registry.py app/model_benchmark.py app/orcha_core.py
      - name: Session handle lifecycle
        env:
          PYTHONPATH: app
        run: python app/session_handle.py
      - name: Streamed tool identity regression
        env:
          PYTHONPATH: app
        run: python app/tool_stream.py
      - name: Durable FIFO mailbox regression
        env:
          PYTHONPATH: app
        run: python app/team_mailbox.py
      - name: Network transport regression
        env:
          PYTHONPATH: app
        run: python app/network_transport.py
      - name: Model discovery normalization regression
        env:
          PYTHONPATH: app
        run: python app/model_registry.py
      - name: Model benchmark contract
        env:
          PYTHONPATH: app
        run: python app/model_benchmark.py
      - name: Core inference contract
        env:
          PYTHONPATH: app
        run: python app/orcha_core.py --self-test
      - name: Derived data backup-and-skip regression
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import storage
          with tempfile.TemporaryDirectory() as td:
              p=Path(td)/'derived.json'
              p.write_text('{broken',encoding='utf-8')
              assert storage.read_json_derived(p,{'clean':True}) == {'clean':True}
              assert not p.exists()
              assert len(list(Path(td).glob('derived.json.bak-*'))) == 1
              authoritative=Path(td)/'authoritative.json'
              authoritative.write_text('{broken',encoding='utf-8')
              try:
                  storage.read_json(authoritative,{})
                  raise AssertionError('authoritative corruption did not fail')
              except RuntimeError:
                  pass
          print('PASS: derived backup-and-skip; authoritative fail-loud')
          PY
