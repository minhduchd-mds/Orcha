name: Orcha brand migration

on:
  push:
    branches:
      - refactor/orcha-only-branding
    paths:
      - 'scripts/_orcha_brand_migrate.py'
      - '.github/workflows/orcha-brand-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/orcha-only-branding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Orcha-only rename
        run: python scripts/_orcha_brand_migrate.py
      - name: Remove one-shot migration script
        run: rm -f scripts/_orcha_brand_migrate.py
      - name: Verify migrated tree
        run: python scripts/check_brand.py
      - name: Fast syntax and UI verification
        run: python scripts/verify.py --fast
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(brand): complete Orcha-only hard rename'
          git push origin HEAD:refactor/orcha-only-branding
